<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    
    <title>CHZZK Follower Monitor</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- 롤링 카운터 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
</head>

<body>
    <main class="container">

        <!-- ========================================= -->
        <!-- 1. 채널 ID 입력 화면 -->
        <!-- ========================================= -->
        <section id="login-section" class="login-page">
            <div class="login-card">
                
                <h1>CHZZK Follower Monitor</h1>
                <p class="login-description">치지직 채널의 실시간 팔로워 수를 확인하세요.</p>

                <div class="login-options">
                    <div class="login-group">
                        <p class="button-description">채널 ID (32자리)를 입력해주세요.</p>

                        <div class="guest-input-group">
                            <input 
                                type="text" 
                                id="guest-channel-id" 
                                class="chzzk-input" 
                                placeholder="채널 ID (예: a182878...)"
                            >
                            <button id="guest-button" class="chzzk-button secondary">
                                조회
                            </button>
                        </div>
                        
                        <!-- 오류 발생 시 메시지를 표시할 공간 -->
                        <div id="guest-input-error" class="input-error-message hidden"></div>
                    </div>
                </div>

            </div>
        </section>


        <!-- ========================================= -->
        <!-- 2. 메인 대시보드 화면 -->
        <!-- ========================================= -->
        <section id="user-section" class="dashboard hidden">
            
            <!-- 상단 헤더 -->
            <header class="top-header minimal-header">
                <button id="logout-button" class="logout-button">뒤로가기</button>
            </header>

            <!-- 중앙 프로필 & 메인 카운터 카드 -->
            <section class="hero-card">
                <div class="hero-profile">
                    <img id="profile-image" alt="프로필 이미지">
                    <div id="channel-name" class="hero-channel-name">-</div>
                    <div id="channel-id" class="hero-channel-id">-</div>
                </div>

                <div class="follower-title">REAL-TIME FOLLOWERS</div>
                <div id="follower-count" class="follower-count odometer">0</div>
                <div id="last-updated" class="last-updated">업데이트 확인 중...</div>
            </section>

            <!-- 상태 모니터링 -->
            <section class="monitor-status">
                <span id="status-dot" class="status-dot"></span>
                <span id="monitor-status-text">팔로워 변화를 확인하는 중...</span>
            </section>

        </section>

    </main>

    <script src="/script.js"></script>
</body>
</html>
