<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    
    <title>CHZZK Follower Monitor</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- 롤링 카운터 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
</head>

<body>
    <main class="container">

        <!-- ========================================= -->
        <!-- 로딩 화면 -->
        <!-- ========================================= -->
        <section id="loading-section" class="login-page">
            <div class="login-card">
                <div class="spinner"></div>
                <h1>로딩 중...</h1>
                <p class="login-description">로그인 상태를 확인하고 있습니다.</p>
            </div>
        </section>


        <!-- ========================================= -->
        <!-- 로그인 화면 (화이트 테마 + 치지직 포인트) -->
        <!-- ========================================= -->
        <section id="login-section" class="login-page hidden">
            <div class="login-card">
                
                <div class="logo">
                    <!-- 치지직 심볼 느낌의 아이콘 -->
                    <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
                        <path d="M4 4l6.5 16h3L20 4h-3.5L12 15 7.5 4H4z"/>
                    </svg>
                </div>
                
                <h1>Follower Monitor</h1>
                <p class="login-description">치지직 팔로워 변화를 실시간으로 확인하세요.</p>

                <div class="login-options">
                    
                    <!-- 1. 치지직 공식 로그인 (목록 포함) -->
                    <div class="login-group">
                        <p class="button-description">누가 팔로우했는지 실시간 활동 내역까지 보려면</p>
                        <button id="login-button" class="chzzk-button primary">
                            CHZZK 계정으로 로그인
                        </button>
                    </div>

                    <div class="login-divider">
                        <span>또는</span>
                    </div>

                    <!-- 2. 비로그인 모드 (카운터 전용) -->
                    <div class="login-group">
                        <p class="button-description">로그인 없이 특정 채널의 롤링 카운터만 보려면</p>
                        <div class="guest-input-group">
                            <input 
                                type="text" 
                                id="guest-channel-id" 
                                class="chzzk-input" 
                                placeholder="채널 ID (예: a182878...)"
                            >
                            <button id="guest-button" class="chzzk-button secondary">
                                조회
                            </button>
                        </div>
                    </div>

                </div>

            </div>
        </section>


        <!-- ========================================= -->
        <!-- 메인 대시보드 -->
        <!-- ========================================= -->
        <section id="user-section" class="dashboard hidden">
            
            <!-- 상단 헤더 (로그아웃 버튼) -->
            <header class="top-header minimal-header">
                <button id="logout-button" class="logout-button">로그아웃</button>
            </header>

            <!-- 1. 중앙 프로필 & 메인 카운터 카드 -->
            <section class="hero-card">
                <div class="hero-profile">
                    <img id="profile-image" alt="프로필 이미지">
                    <div id="channel-name" class="hero-channel-name">-</div>
                    <div id="channel-id" class="hero-channel-id">-</div>
                </div>

                <div class="follower-title">REAL-TIME FOLLOWERS</div>
                <div id="follower-count" class="follower-count odometer">0</div>
                <div id="last-updated" class="last-updated">업데이트 확인 중...</div>
            </section>

            <!-- 상태 모니터링 -->
            <section class="monitor-status">
                <span id="status-dot" class="status-dot"></span>
                <span id="monitor-status-text">팔로워 변화를 확인하는 중...</span>
            </section>

            <!-- 2. 실시간 활동 내역 (내부 스크롤) -->
            <section class="activity-card">
                <div class="activity-header">
                    <div>
                        <h2>실시간 활동</h2>
                        <p>최근 팔로우 및 언팔로우 내역</p>
                    </div>
                    <span id="activity-count" class="activity-count">0</span>
                </div>

                <!-- 💡 목록 박스 내부 스크롤 컨테이너 -->
                <div id="activity-list" class="activity-list">
                    <div id="empty-activity" class="empty-activity">
                        아직 확인된 팔로워 활동이 없습니다.
                    </div>
                </div>
            </section>

        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
