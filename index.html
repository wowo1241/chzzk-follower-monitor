<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    
    <title>CHZZK Follower Monitor</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- 롤링 카운터 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
</head>

<body>
    <main class="container">

        <!-- ========================================= -->
        <!-- 1. 로딩 화면 -->
        <!-- ========================================= -->
        <section id="loading-section" class="login-page">
            <div class="login-card">
                <div class="spinner"></div>
                <h1>로딩 중...</h1>
                <p class="login-description">로그인 상태를 확인하고 있습니다.</p>
            </div>
        </section>


        <!-- ========================================= -->
<!-- 로그인 화면 -->
<!-- ========================================= -->
<section id="login-section" class="login-page hidden">
    <div class="login-card">
        
        <div class="logo">
            <!-- 치지직 심볼 느낌의 아이콘 -->
            <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
                <path d="M4 4l6.5 16h3L20 4h-3.5L12 15 7.5 4H4z"></path>
            </svg>
        </div>
        
        <h1>Follower Monitor</h1>
        <p class="login-description">치지직 팔로워 변화를 실시간으로 확인하세요.</p>

        <div class="login-options">
            
            <!-- 💡 [새로 추가된 부분] 2. 비로그인 모드 (카운터 전용) -->
            <div class="login-group">
                <p class="button-description" style="font-size: 12px; color: #888; margin: 0 0 8px 0; font-weight: 600;">
                    로그인하지 않고도 채널 ID를 입력하여<br>비공식 API를 이용해 팔로워 수를 조회할 수 있습니다.
                </p>
                <div class="guest-input-group" style="display: flex; gap: 8px; margin-bottom: 20px;">
                    <input type="text" id="guest-channel-id" class="chzzk-input" placeholder="채널 ID 입력" style="flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9f9; color: #111; font-size: 14px; outline: none;">
                    <button id="guest-button" class="chzzk-button secondary" style="padding: 0 24px; background: #141517; color: #00c73c; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer;">
                        비로그인으로 조회
                    </button>
                </div>
            </div>

            <!-- 구분선 -->
            <div style="border-top: 1px solid #eaeaea; margin-bottom: 20px;"></div>

            <!-- 1. 기존 치지직 공식 로그인 (목록 포함) -->
            <div class="login-group">
                <button id="login-button" class="chzzk-button primary">
                    CHZZK 계정으로 로그인
                </button>
            </div>

        </div>

    </div>
</section>


        <!-- ========================================= -->
        <!-- 3. 메인 대시보드 화면 -->
        <!-- ========================================= -->
        <section id="user-section" class="dashboard hidden">
            
            <!-- 상단 헤더 -->
            <header class="top-header minimal-header">
                <button id="logout-button" class="logout-button">로그아웃 또는 뒤로가기</button>
            </header>

            <!-- 중앙 프로필 & 메인 카운터 카드 -->
            <section class="hero-card">
                <div class="hero-profile">
                    <img id="profile-image" alt="프로필 이미지">
                    <div id="channel-name" class="hero-channel-name">-</div>
                    <div id="channel-id" class="hero-channel-id">-</div>
                </div>

                <div class="follower-title">REAL-TIME FOLLOWERS</div>
                <div id="follower-count" class="follower-count odometer">0</div>
                <div id="last-updated" class="last-updated">업데이트 확인 중...</div>
            </section>

            <!-- 상태 모니터링 -->
            <section class="monitor-status">
                <span id="status-dot" class="status-dot"></span>
                <span id="monitor-status-text">팔로워 변화를 확인하는 중...</span>
            </section>

            <!-- 실시간 활동 내역 -->
            <section class="activity-card" id="activity-section">
                <div class="activity-header">
                    <div>
                        <h2>실시간 활동</h2>
                        <p>최근 팔로우 및 언팔로우 내역</p>
                    </div>
                    <span id="activity-count" class="activity-count">0</span>
                </div>

                <!-- 내부 스크롤 목록 -->
                <div id="activity-list" class="activity-list">
                    <div id="empty-activity" class="empty-activity">
                        아직 확인된 팔로워 활동이 없습니다.
                    </div>
                </div>
            </section>

        </section>

    </main>

    <script src="/script.js"></script>
</body>
</html>
